# Console & Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Lightning-Detector"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1

# PDM Digital Microphone Driver
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_DMIC_NRFX_PDM=y

# DSP Math Library (CMSIS-DSP for audio threshold & FFT/ML features)
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y

# System Stack Sizing for Audio Processing
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096